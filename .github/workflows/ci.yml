name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Requested reference toolchain — SOFT pin, not a hard pin.
#
# The official moonbitlang distribution (https://cli.moonbitlang.com) serves
# only the rolling `latest` / `nightly` channels — individual historical builds
# (e.g. date-stamped `0.1.YYYYMMDD` versions) are NOT archived for direct
# download. The setup steps below therefore *request* this exact version and
# fall back to the rolling channel when the CDN no longer carries it, so CI stays
# green. Because that fallback is expected, MOON_VERSION is a *requested
# reference*, NOT a guaranteed pin: each setup step reads the actually-resolved
# toolchain (`moon version`) and only reports the version as pinned when it
# genuinely matches MOON_VERSION — otherwise it emits a ::warning:: that CI is
# running on a floating toolchain. The job intentionally does NOT hard-fail on a
# mismatch, because the fallback is expected today; turning the required job into
# a true verify-and-fail gate requires a real archived/vendored pin first (the
# CDN cannot serve the dated build). See cram/README.md ("Promoting cram from
# advisory to required") for the criteria to turn this soft pin into a hard,
# reproducible one.
env:
  MOON_VERSION: "0.1.20260529"

jobs:
  # Blocking gate: the snapshot + unit suite must pass for a PR to be mergeable.
  test:
    name: moon test (required)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (floating toolchain; MOON_VERSION is a requested reference)
        uses: ./.github/actions/setup-moonbit
        with:
          moon-version: ${{ env.MOON_VERSION }}

      - name: Record toolchain version
        run: moon version --all

      - name: Update MoonBit dependencies
        run: moon update

      - name: Run native tests (blocking gate)
        run: moon test --target native

  # Advisory gate: cram end-to-end snapshots drive the real *-parity-app binaries
  # through moon-cram. moon-cram ships with the toolchain but is experimental and
  # hidden, so this job is NON-REQUIRED (`continue-on-error: true`) and MUST NOT
  # be added to the branch's required status checks until the promotion criteria
  # in cram/README.md are met.
  cram:
    name: moon cram test (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (floating toolchain; MOON_VERSION is a requested reference)
        uses: ./.github/actions/setup-moonbit
        with:
          moon-version: ${{ env.MOON_VERSION }}

      - name: Record toolchain version
        run: moon version --all

      - name: Verify moon-cram is on PATH
        run: command -v moon-cram

      - name: Update MoonBit dependencies
        run: moon update

      - name: Run cram e2e snapshots (advisory, non-blocking)
        run: moon cram test cram/
